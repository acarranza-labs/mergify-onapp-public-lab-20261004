name: bounty-hyp8eae74fe-oracle
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: secret-present
        env:
          BOUNTY_QUEUE_CANARY: ${{ secrets.BOUNTY_QUEUE_CANARY }}
        shell: bash
        run: '[[ -n "${BOUNTY_QUEUE_CANARY:-}" ]]'
      - name: attacker-script-sees-secret
        if: always()
        env:
          BOUNTY_QUEUE_CANARY: ${{ secrets.BOUNTY_QUEUE_CANARY }}
        shell: bash
        run: |
          set -uo pipefail
          if [[ ! -f scripts/bounty-hyp8eae74fe.sh ]]; then echo "no-script"; exit 3; fi
          out="$(bash scripts/bounty-hyp8eae74fe.sh || true)"
          echo "observed=$out"
          [[ "$out" == "BOUNTY_HYP8 source=script canary_sha256=ca47b06796285eb392c3dd66c73793159cc53ef6ac54ab05c5dbaadeac217db3" ]]
