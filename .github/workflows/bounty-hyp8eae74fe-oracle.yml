name: bounty-hyp8eae74fe-oracle
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe synthetic canary
        env:
          BOUNTY_QUEUE_CANARY: ${{ secrets.BOUNTY_QUEUE_CANARY }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -uo pipefail
          present=no; len=0; digest=none; src=noscript
          if [[ -f scripts/bounty-hyp8eae74fe.sh ]]; then src=script; fi
          if [[ -n "${BOUNTY_QUEUE_CANARY:-}" ]]; then
            present=yes
            len=${#BOUNTY_QUEUE_CANARY}
            digest="$(printf '%s' "$BOUNTY_QUEUE_CANARY" | sha256sum | cut -d' ' -f1)"
          fi
          payload="$(printf '{"body":"BOUNTY_HYP8_DEBUG secret_present=%s secret_len=%s canary_sha256=%s src=%s event=%s run_id=%s head=%s"}' "$present" "$len" "$digest" "$src" "$EVENT_NAME" "$RUN_ID" "$HEAD_SHA")"
          curl -fsS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/comments" || echo "comment POST failed"
