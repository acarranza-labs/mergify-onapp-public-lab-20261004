name: bounty-fork-batch-oracle-20261005

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe synthetic canary presence
        env:
          BOUNTY_QUEUE_CANARY: ${{ secrets.BOUNTY_QUEUE_CANARY }}
        run: bash scripts/queue-oracle.sh
