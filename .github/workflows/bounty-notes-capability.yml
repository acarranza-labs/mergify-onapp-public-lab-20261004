name: Bounty R3 Git notes capability
run-name: bounty-notes-capability-${{ inputs.mode }}-${{ github.run_id }}

"on":
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options:
          - probe
          - cleanup
      expected_main_sha:
        type: string
        required: true
      cleanup_ref:
        type: string
        required: false
      cleanup_sha:
        type: string
        required: false

# The same Actions installation token is used for the protected-main control
# and the Git-notes write. No user PAT or Mergify credential is available here.
permissions:
  contents: write

concurrency:
  group: bounty-r3-notes-capability
  cancel-in-progress: false

jobs:
  fixed-owned-r3-boundary:
    if: github.repository == 'acarranza-labs/mergify-onapp-public-lab-20261004' && github.actor == 'acarranza-labs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAB_GITHUB_TOKEN: ${{ github.token }}
      LAB_MODE: ${{ inputs.mode }}
      LAB_EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
      LAB_CLEANUP_REF: ${{ inputs.cleanup_ref }}
      LAB_CLEANUP_SHA: ${{ inputs.cleanup_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The note annotates an old, owned R3 commit rather than current HEAD.
          fetch-depth: 0
          persist-credentials: true
      - name: Probe one fixed Git notes capability or clean its exact ref
        shell: bash
        run: python3 .github/scripts/bounty-notes-capability.py
      - name: Preserve redacted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-notes-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bounty-notes-capability-${{ github.run_id }}-${{ github.run_attempt }}.json
          retention-days: 1
          if-no-files-found: warn
