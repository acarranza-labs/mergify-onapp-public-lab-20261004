name: bounty-notes-chain-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  detect-scopes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ fromJSON(steps.scopes.outputs.scopes).api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record batch identity and allow one bounded note window
        if: startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          BATCH_REF: ${{ github.event.pull_request.head.ref }}
          BATCH_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'BATCH_READY ref=%s sha=%s\n' "$BATCH_REF" "$BATCH_SHA"
          sleep 180
      - name: Detect scopes with Mergify's published action
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v26
        with:
          action: scopes
      - name: Record deployed CLI and parsed scopes
        env:
          SCOPES_JSON: ${{ steps.scopes.outputs.scopes }}
          API_SCOPE: ${{ fromJSON(steps.scopes.outputs.scopes).api }}
        run: |
          mergify --version
          printf 'SCOPE_RESULT api=%s scopes=%s\n' "$API_SCOPE" "$SCOPES_JSON"

  api-tests:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.api == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject the oracle canary or a two-file integration conflict
        run: |
          set -euo pipefail
          if [[ -f api/bounty-canary.txt ]]; then
            echo 'ORACLE_CANARY_REJECTED'
            exit 1
          fi
          for cohort in control candidate; do
            a="api/$cohort/a-canary.txt"
            b="api/$cohort/b-canary.txt"
            if [[ -f "$a" && -f "$b" ]]; then
              printf 'INTEGRATION_CONFLICT cohort=%s\n' "$cohort"
              exit 1
            fi
          done
          echo 'INTEGRATION_OK'

  ci-gate:
    needs: [detect-scopes, api-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require exactly the outcome dictated by the detected scope
        env:
          DETECT_RESULT: ${{ needs.detect-scopes.result }}
          API_SCOPE: ${{ needs.detect-scopes.outputs.api }}
          API_TEST_RESULT: ${{ needs.api-tests.result }}
        run: |
          set -euo pipefail
          printf 'GATE_INPUT detect=%s api=%s api_tests=%s\n' "$DETECT_RESULT" "$API_SCOPE" "$API_TEST_RESULT"
          [[ "$DETECT_RESULT" == success ]] || exit 1
          if [[ "$API_SCOPE" == true ]]; then
            [[ "$API_TEST_RESULT" == success ]] || exit 1
          elif [[ "$API_SCOPE" == false ]]; then
            [[ "$API_TEST_RESULT" == skipped ]] || exit 1
          else
            exit 1
          fi
          echo 'GATE_OK'
