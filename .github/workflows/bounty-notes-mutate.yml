name: bounty-notes-mutate

on:
  workflow_dispatch:
    inputs:
      batch_pr:
        description: Exact owned batch PR number
        required: true
      batch_head_sha:
        description: Exact recorded batch head SHA
        required: true
      notes_ref_sha:
        description: Exact recorded notes ref SHA
        required: true
      main_sha:
        description: Exact main SHA before the note write
        required: true
      first_pr:
        description: First owned candidate PR number
        required: true
      second_pr:
        description: Second owned candidate PR number
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  mutate-note:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned YAML parser for faithful mapping changes
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Reprove main write denial and alter only the candidate batch note
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_BATCH_PR: ${{ inputs.batch_pr }}
          EXPECT_BATCH_HEAD: ${{ inputs.batch_head_sha }}
          EXPECT_NOTES_REF_SHA: ${{ inputs.notes_ref_sha }}
          EXPECT_MAIN_SHA: ${{ inputs.main_sha }}
          EXPECT_FIRST_PR: ${{ inputs.first_pr }}
          EXPECT_SECOND_PR: ${{ inputs.second_pr }}
        run: python .github/scripts/bounty-notes-mutate.py
