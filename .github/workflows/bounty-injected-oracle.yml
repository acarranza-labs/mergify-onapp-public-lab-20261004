name: bounty-injected-workflow-oracle-20261005

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  injected_oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Observe only the synthetic canary digest
        env:
          BOUNTY_QUEUE_CANARY: ${{ secrets.BOUNTY_QUEUE_CANARY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BOUNTY_QUEUE_CANARY:-}" ]]; then
            printf '%s\n' 'BOUNTY_INJECTED_WORKFLOW_ORACLE source=fork-workflow canary=absent'
          else
            digest="$(printf '%s' "$BOUNTY_QUEUE_CANARY" | sha256sum | cut -d' ' -f1)"
            printf 'BOUNTY_INJECTED_WORKFLOW_ORACLE source=fork-workflow canary_sha256=%s\n' "$digest"
          fi
