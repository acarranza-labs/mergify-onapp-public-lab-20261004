name: Bounty queue branch edit guard
run-name: bounty-queue-edit-${{ inputs.mode }}-${{ github.run_id }}

"on":
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options:
          - probe
          - edit
      expected_main_sha:
        type: string
        required: true
      batch_branch:
        type: string
        required: false
      expected_batch_sha:
        type: string
        required: false
      batch_pr:
        type: string
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  fixed-owned-r3-probe:
    if: github.repository == 'acarranza-labs/mergify-onapp-public-lab-20261004' && github.actor == 'acarranza-labs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      LAB_MODE: ${{ inputs.mode }}
      LAB_EXPECTED_MAIN: ${{ inputs.expected_main_sha }}
      LAB_BATCH_BRANCH: ${{ inputs.batch_branch }}
      LAB_EXPECTED_BATCH: ${{ inputs.expected_batch_sha }}
      LAB_BATCH_PR: ${{ inputs.batch_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test one fixed lower-principal path
        shell: bash
        run: python .github/scripts/bounty-queue-edit.py
