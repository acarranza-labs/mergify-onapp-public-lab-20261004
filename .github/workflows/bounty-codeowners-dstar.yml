name: Bounty CODEOWNERS double-star controls
run-name: bounty-codeowners-dstar-${{ inputs.case }}-20261005

on:
  workflow_dispatch:
    inputs:
      case:
        description: Fixed owned-repository CODEOWNERS case
        type: choice
        required: true
        options:
          - exact
          - free
          - double_star

permissions:
  contents: write
  pull-requests: write

jobs:
  open-lab-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAB_CASE: ${{ inputs.case }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open exactly one inert canary PR
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = "acarranza-labs/mergify-onapp-public-lab-20261004"
          PARENT = "616af1c423f1e8ccb7a28761a8780074468dadd6"
          CASES = {
              "exact": {
                  "branch": "bounty-codeowners-dstar-exact-20261005",
                  "path": "control/exact-canary.txt",
                  "text": "Owned R3 CODEOWNERS exact-path control.\n",
                  "title": "bounty-codeowners-dstar-exact-20261005",
              },
              "free": {
                  "branch": "bounty-codeowners-dstar-free-20261005",
                  "path": "deeply/nested/logsx/canary.txt",
                  "text": "Owned R3 CODEOWNERS non-matching control.\n",
                  "title": "bounty-codeowners-dstar-free-20261005",
              },
              "double_star": {
                  "branch": "bounty-codeowners-dstar-double-star-20261005",
                  "path": "deeply/nested/logs/canary.txt",
                  "text": "Owned R3 CODEOWNERS double-star candidate.\n",
                  "title": "bounty-codeowners-dstar-double-star-20261005",
              },
          }
          case = os.environ.get("LAB_CASE")
          if case not in CASES:
              raise SystemExit("Unknown fixed case")
          if (os.environ.get("GITHUB_REPOSITORY") != REPO
                  or os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
                  or os.environ.get("GITHUB_REF") != "refs/heads/main"
                  or os.environ.get("GITHUB_ACTOR") != "acarranza-labs"):
              raise SystemExit("Unexpected repository, event, branch, or actor")
          token = os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("Missing job token")
          selected = CASES[case]
          branch = selected["branch"]
          allowed = {
              ("GET", f"repos/{REPO}/git/ref/heads/main"),
              ("GET", f"repos/{REPO}/git/ref/heads/{branch}"),
              ("GET", f"repos/{REPO}/pulls?state=open&per_page=100"),
              ("POST", f"repos/{REPO}/git/refs"),
              ("PUT", f"repos/{REPO}/contents/{selected['path']}"),
              ("POST", f"repos/{REPO}/pulls"),
          }

          def api(method, path, body=None, missing_ok=False):
              if (method, path) not in allowed:
                  raise RuntimeError("API route outside fixed owned R3 case")
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/{path}", data=data, method=method,
                  headers={"Accept": "application/vnd.github+json",
                           "Authorization": f"Bearer {token}",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise RuntimeError(f"GitHub {method} failed: HTTP {error.code}") from None

          current = api("GET", f"repos/{REPO}/git/ref/heads/main")["object"]["sha"]
          if current != os.environ.get("GITHUB_SHA"):
              raise SystemExit("Main moved after workflow dispatch")
          commit_path = f"repos/{REPO}/git/commits/{current}"
          allowed.add(("GET", commit_path))
          parent = api("GET", commit_path)
          if [p["sha"] for p in parent["parents"]] != [PARENT]:
              raise SystemExit("Main is not the one-commit laboratory fixture")
          if api("GET", f"repos/{REPO}/git/ref/heads/{branch}", missing_ok=True):
              raise SystemExit("Fixed branch already exists")
          prs = api("GET", f"repos/{REPO}/pulls?state=open&per_page=100")
          if len(prs) >= 100 or prs:
              raise SystemExit("Unexpected open PR before fixed case")
          api("POST", f"repos/{REPO}/git/refs", {
              "ref": f"refs/heads/{branch}", "sha": current})
          content = api("PUT", f"repos/{REPO}/contents/{selected['path']}", {
              "message": f"Bounty lab: CODEOWNERS {case} canary",
              "content": base64.b64encode(selected["text"].encode()).decode(),
              "branch": branch})
          child = content["commit"]["sha"]
          run_id = os.environ.get("GITHUB_RUN_ID")
          if not run_id or not run_id.isdecimal():
              raise SystemExit("Missing numeric workflow run ID")
          body = (f"Owned R3 CODEOWNERS {case} canary. Run {run_id}; "
                  f"head {child}. Do not merge.")
          pr = api("POST", f"repos/{REPO}/pulls", {
              "title": selected["title"], "body": body,
              "head": branch, "base": "main", "draft": False,
              "maintainer_can_modify": False})
          print(json.dumps({"case": case, "pr": pr["number"],
                            "head_sha": child, "base_sha": current}))
          PY
