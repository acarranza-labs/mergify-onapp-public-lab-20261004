scopes:
  source:
    files:
      tooling:
        include:
          - docs/**
      api:
        include:
          - services/api/**
  barrier_files:
    include:
      - build/critical.txt

merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: bounty-barrier-classify-20261005
    batch_size: 1
    max_checks_retries: 1
    merge_method: merge
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = bounty-barrier-hold-20261005

pull_request_rules: []
