merge_queue:
  max_parallel_checks: 2

queue_rules:
  - name: bounty-fork-workflow-canary
    batch_size: 1
    branch_protection_injection_mode: merge
    queue_conditions:
      - base = main
    merge_conditions:
      - "#approved-reviews-by >= 1"

pull_request_rules:
  - name: queue only title canary
    conditions:
      - base = main
      - title = bounty-queue-trigger
    actions:
      queue: {}
