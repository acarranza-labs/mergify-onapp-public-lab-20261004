scopes:
  source:
    files:
      api:
        include:
          - api/**

merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: bounty-notes-chain-20261005
    batch_size: 2
    batch_max_wait_time: 2 min
    batch_max_failure_resolution_attempts: 0
    merge_method: merge-batch
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = @github-actions/ci-gate

pull_request_rules: []
