scopes:
  source:
    files:
      api:
        include:
          - api/**

merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: bounty-direct-merge-20261005
    batch_size: 1
    batch_max_wait_time: 2 min
    merge_method: merge
    queue_conditions:
      - base = main
      - check-success = @github-actions/ci-gate

pull_request_rules:
  - name: autoqueue-only-after-official-ci-gate
    conditions:
      - base = main
      - -draft
      - label = bounty-direct-merge-20261005
      - check-success = @github-actions/ci-gate
    actions:
      queue:
